name: apnikhareedari

services:
  app:
    build:
      context: ./docker/php
    container_name: akd_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      PHP_IDE_CONFIG: "serverName=akd"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - akd

  queue:
    build:
      context: ./docker/php
    container_name: akd_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: php artisan queue:work --tries=3 --sleep=1
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - akd

  webserver:
    image: nginx:stable-alpine
    container_name: akd_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - akd
    # OPcache only compiles PHP into shared memory on first use per app-container
    # start (see docker/php/opcache.ini), so the very first real request after
    # any restart pays a multi-second one-time cost. This healthcheck pings a
    # real API route every few seconds, so that cost lands on an internal ping
    # instead of a customer's — by the time anyone loads the site, it's warm.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/api/products && wget -q -O /dev/null http://127.0.0.1/api/categories && wget -q -O /dev/null http://127.0.0.1/api/settings/public",
        ]
      interval: 10s
      timeout: 8s
      retries: 3
      start_period: 5s

  mysql:
    image: mysql:8.0
    container_name: akd_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: apnikhareedari
      MYSQL_USER: akd_user
      MYSQL_PASSWORD: akd_password
      MYSQL_ROOT_PASSWORD: akd_root_password
    ports:
      - "3307:3306"
    volumes:
      - akd_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pakd_root_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - akd

  mailhog:
    image: mailhog/mailhog
    container_name: akd_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - akd

networks:
  akd:
    driver: bridge

volumes:
  akd_mysql_data:

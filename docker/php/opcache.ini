; Bytecode caching avoids re-parsing/re-compiling the full Laravel + Composer
; vendor tree on every request. On Docker Desktop for Windows, bind-mounted
; volumes make every filesystem stat() call (used to detect changed files)
; cross into the WSL2 VM and back, which is slow enough that checking every
; single included file adds multiple seconds. A revalidate_freq window still
; pays that cost on the first request after each window expires, which is
; noticeable during normal browsing (gaps between clicks usually exceed a
; couple of seconds). validate_timestamps=0 skips the check entirely for
; consistently fast requests. The cost: editing a backend PHP file requires
; `docker compose restart app` to pick up the change (opcache.enable_cli=0
; means `artisan` commands are unaffected and always run fresh code).
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.jit=off

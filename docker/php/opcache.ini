; Bytecode caching avoids re-parsing/re-compiling the full Laravel + Composer
; vendor tree on every request. On Docker Desktop for Windows, bind-mounted
; volumes make every filesystem stat() call (used to detect changed files)
; cross into the WSL2 VM and back, which is slow enough that checking every
; single included file on every request adds several seconds per request.
; revalidate_freq batches that check to once every 2s per file instead of
; every request, so edited PHP files are still picked up automatically
; within ~2 seconds without a manual cache clear.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.jit=off
